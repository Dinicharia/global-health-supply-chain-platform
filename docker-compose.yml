# =============================================================================
# Docker Compose: Global Health Supply Chain Intelligence Platform
# =============================================================================
# Purpose: launches PostgreSQL, Prefect Server, a Prefect Worker (runs
#          our pipeline on schedule), and Apache Superset with a single
#          command: docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL: bronze/silver/gold/quality schemas, plus prefect/superset DBs
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: supply-chain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - supply-chain-pgdata:/var/lib/postgresql/data
      - ./sql/schemas:/docker-entrypoint-initdb.d/manual-reference:ro
      # Only runs automatically on a FRESH volume's first boot -- see
      # docker/postgres-init.sql header comment.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supply-chain-network

  # ---------------------------------------------------------------------------
  # Prefect Server
  # ---------------------------------------------------------------------------
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: supply-chain-prefect-server
    command: prefect server start --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_HOME: /root/.prefect
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
    volumes:
      - supply-chain-prefect-data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - supply-chain-network

  # ---------------------------------------------------------------------------
  # Prefect Worker + our Python ETL code
  # ---------------------------------------------------------------------------
  prefect-worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    container_name: supply-chain-prefect-worker
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    env_file:
      - .env.docker
    volumes:
      - ./src:/app/src
      - ./flows:/app/flows
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      sh -c "prefect work-pool create --type process local-process-pool --overwrite &&
             prefect deploy --all --prefect-file prefect.docker.yaml &&
             exec prefect worker start --pool local-process-pool"
    networks:
      - supply-chain-network

  # ---------------------------------------------------------------------------
  # Apache Superset
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: .
      dockerfile: docker/superset.Dockerfile
    container_name: supply-chain-superset
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: ${SUPERSET_DATABASE_URI}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    env_file:
      - .env.docker
    volumes:
      - ./docker/superset-init.sh:/app/docker/superset-init.sh:ro
      - supply-chain-superset-data:/app/superset_home
    ports:
      - "8088:8088"
    entrypoint: ["/bin/bash", "/app/docker/superset-init.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - supply-chain-network

networks:
  supply-chain-network:
    driver: bridge

volumes:
  supply-chain-pgdata:
    name: supply-chain-pgdata
  supply-chain-prefect-data:
    name: supply-chain-prefect-data
  supply-chain-superset-data:
    name: supply-chain-superset-data